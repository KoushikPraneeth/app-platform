name: CI pipeline for web-client

on:
  push:
    branches: ["main"]
    paths: ["services/web-client/**", ".github/workflows/web-client.yml"]
  pull_request:
    branches: ["main"]
    paths: ["services/web-client/**", ".github/workflows/web-client.yml"]

jobs:
  lint-and-sonar:
    # Checkout the Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # Shallow clones disabled: SonarCloud requires full git history for blame & new-code tracking
        with:
          fetch-depth: 0

      # Set up Node.js
      - name: Set up Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      # Install Dependencies
      - name: Install Dependencies
        run: npm ci
        working-directory: services/web-client

      # Run ESLint
      - name: Run ESLint
        run: npm run lint
        working-directory: services/web-client

      # SonarCloud Scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=KoushikPraneeth_app-platform
            -Dsonar.organization=koushikpraneeth
            -Dsonar.sources=services/web-client/src

  build-and-push-image:
    permissions:
      contents: read
      packages: write
    needs: lint-and-sonar
    runs-on: ubuntu-latest
    steps:
      # Checkout the Code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Login to GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Docker Image locally for security scanning
      - name: Build and Push the Docker Image
        uses: docker/build-push-action@v4
        with:
          context: services/web-client
          push: false
          load: true
          tags: ghcr.io/koushikpraneeth/app-platform/web-client:${{ github.sha }}

      # Trivy scan the image
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/koushikpraneeth/app-platform/web-client:${{ github.sha }}"
          format: "json"
          output: "trivy-web-client.json"
          # Fail on fixable CRITICAL findings in the built runtime image
          exit-code: "1"
          severity: "CRITICAL"
          ignore-unfixed: true

      - name: Preserve runtime security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-web-client
          path: trivy-web-client.json
          if-no-files-found: warn

      # Push the image to the GHCR
      - name: Push the image to the GHCR
        # Don't Push Images on Pull Requests!
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/koushikpraneeth/app-platform/web-client:${{ github.sha }}
