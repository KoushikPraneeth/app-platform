name: CI pipeline for notify-service
on:
  push:
    branches: ["main"]
    paths:
      ["services/notify-service/**", ".github/workflows/notify-service.yml"]
  pull_request:
    branches: ["main"]
    paths:
      ["services/notify-service/**", ".github/workflows/notify-service.yml"]

jobs:
  test-and-sonar:
    runs-on: ubuntu-latest
    steps:
      # Checkout the Code
      - name: Checkout code
        uses: actions/checkout@v4
        # Shallow clones disabled: SonarCloud requires full git history for blame & new-code tracking
        with:
          fetch-depth: 0

          # Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: "pip"

          # Install Dependencies & Testing Tools
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/notify-service/requirements.txt
          pip install pytest pytest-cov -r services/notify-service/requirements-test.txt

          # Run Unit Tests & Generate Coverage
      - name: Run Tests
        working-directory: services/notify-service
        # pytest to output the coverage in XML format
        run: pytest --cov=app --cov-report=xml tests/

        # SonarCloud Scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=KoushikPraneeth_app-platform
            -Dsonar.organization=koushikpraneeth
            -Dsonar.sources=services/notify-service/app
            -Dsonar.tests=services/notify-service/tests
            -Dsonar.python.coverage.reportPaths=services/notify-service/coverage.xml

  build-and-push-image:
    permissions:
      contents: read
      packages: write
    needs: test-and-sonar
    runs-on: ubuntu-latest
    steps:
      # Checkout the Code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

          # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses:
          docker/setup-buildx-action@v2

          # Login to GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

          # Build Docker Image locally for security scanning
          # Immutable tagging: Git commit SHA ensures traceable, non-overwritable deployments
      - name: Build and Push the Docker Image
        uses: docker/build-push-action@v4
        with:
          context: services/notify-service
          push: false
          load: true
          tags: ghcr.io/koushikpraneeth/app-platform/notify-service:${{ github.sha }}

          # Trivy scan the image
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/koushikpraneeth/app-platform/notify-service:${{ github.sha }}"
          format: "table"
          # Shift-left security: fail pipeline immediately if HIGH or CRITICAL CVEs exist
          exit-code: "1"
          severity: "CRITICAL"
          ignore-unfixed: true

          # Push the image to the GHCR
      - name: Push the image to the GHCR
        # Don't Push Images on Pull Requests!
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/koushikpraneeth/app-platform/notify-service:${{ github.sha }}
