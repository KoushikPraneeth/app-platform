name: CI pipeline for core-api
on:
  push:
    branches: ["main"]
    paths: ["services/core-api/**", ".github/workflows/core-api.yml"]
  pull_request:
    branches: ["main"]
    paths: ["services/core-api/**", ".github/workflows/core-api.yml"]

jobs: 
  test-and-sonar:
    runs-on: ubuntu-latest
    steps: 
      # Checkout the Code
      - name: Checkout code
        uses: actions/checkout@v4
        # # Shallow clones disabled: SonarCloud requires full git history for blame & new-code tracking
        with: 
          fetch-depth: 0

      # Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: 'pip'  

      # Install Dependencies & Testing Tools
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/core-api/requirements.txt
          pip install pytest pytest-cov

      # Run Unit Tests & Generate Coverage
      - name: Run Tests
        working-directory: services/core-api
        # pytest to output the coverage in XML format
        run: pytest --cov=app --cov-report=xml tests/

      # SonarCloud Scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=KoushikPraneeth_app-platform
            -Dsonar.organization=KoushikPraneeth
            -Dsonar.sources=services/core-api/app
            -Dsonar.tests=services/core-api/tests
            -Dsonar.python.coverage.reportPaths=services/core-api/coverage.xml

  build-and-push-image:
    permissions:
      contents: read
      packages: write
    needs: test-and-sonar
    runs-on: ubuntu-latest
    steps:
      # Checkout the Code
      - name: Checkout code
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0
      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      # Login to GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build Docker Image locally for security scanning
      - name: Build and Push the Docker Image
        uses: docker/build-push-action@v4
        with:
          context: services/core-api
          push: false
          load: true   
        # Immutable tagging: Git commit SHA ensures traceable, non-overwritable deployments
          tags: ghcr.io/koushikpraneeth/app-platform/core-api:${{ github.sha }}

      # Trivy scan the image
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/koushikpraneeth/app-platform/core-api:${{ github.sha }}'
          format: 'table'   
          # Shift-left security: fail pipeline immediately if HIGH or CRITICAL CVEs exist
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # Push the image to the GHCR
      - name: Push the image to the GHCR
        # Don't Push Images on Pull Requests!
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/koushikpraneeth/app-platform/core-api:${{ github.sha }}






        

      
        




