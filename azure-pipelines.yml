trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - 'README.md'
      - '.gitignore'

pool:
  vmImage: 'ubuntu-latest'

variables:
  acrServiceConnection: 'acr-service-connection'
  acrRegistry: 'acrdevpk.azurecr.io'

jobs:
  - job: Complete_CI_CD_Pipeline
    displayName: 'Automated CI/CD: Test, Build, Scan & GitOps Promotion'
    timeoutInMinutes: 25
    steps:
      # =====================================================================
      # 1. QUALITY & SECURITY GATES
      # =====================================================================
      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.11'
        displayName: 'Set up Python 3.11'

      - script: |
          python -m pip install --upgrade pip
          pip install -r services/core-api/requirements.txt pytest pytest-cov
          cd services/core-api && pytest tests/
        displayName: 'Pytest: core-api'

      - script: |
          pip install -r services/notify-service/requirements.txt pytest pytest-cov httpx
          cd services/notify-service && pytest tests/
        displayName: 'Pytest: notify-service'

      - task: NodeTool@0
        inputs:
          versionSpec: '20.x'
        displayName: 'Set up Node.js 20.x'

      - script: |
          cd services/web-client
          npm install
          npm run lint
        displayName: 'ESLint: web-client'

      - script: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy fs --severity HIGH,CRITICAL --exit-code 0 services/core-api
          trivy fs --severity HIGH,CRITICAL --exit-code 0 services/web-client
        displayName: 'Trivy: Security Scan (High & Critical)'

      # =====================================================================
      # 2. DOCKER BUILD & PUSH (IMMUTABLE SHA TAGS)
      # =====================================================================
      - script: |
          if [ -f /etc/docker/daemon.json ]; then
            sudo jq '. + {"mtu": 1400}' /etc/docker/daemon.json > /tmp/daemon.json && sudo mv /tmp/daemon.json /etc/docker/daemon.json
          else
            echo '{"mtu": 1400}' | sudo tee /etc/docker/daemon.json
          fi
          sudo systemctl restart docker
        displayName: 'Configure Docker MTU (1400) for Azure Runner'

      - task: Docker@2
        displayName: 'Build & Push: core-api'
        inputs:
          containerRegistry: $(acrServiceConnection)
          repository: 'core-api'
          command: 'buildAndPush'
          Dockerfile: 'services/core-api/Dockerfile'
          buildContext: 'services/core-api'
          tags: |
            $(Build.SourceVersion)
            latest

      - task: Docker@2
        displayName: 'Build & Push: web-client'
        inputs:
          containerRegistry: $(acrServiceConnection)
          repository: 'web-client'
          command: 'buildAndPush'
          Dockerfile: 'services/web-client/Dockerfile'
          buildContext: 'services/web-client'
          tags: |
            $(Build.SourceVersion)
            latest

      - task: Docker@2
        displayName: 'Build & Push: notify-service'
        inputs:
          containerRegistry: $(acrServiceConnection)
          repository: 'notify-service'
          command: 'buildAndPush'
          Dockerfile: 'services/notify-service/Dockerfile'
          buildContext: 'services/notify-service'
          tags: |
            $(Build.SourceVersion)
            latest

      # =====================================================================
      # 3. GITOPS AUTOMATED PROMOTION
      # =====================================================================
      - script: |
          if [ -z "$TOKEN" ]; then
            echo "##vso[task.logissue type=error]GITHUB_PAT is empty. GitOps promotion aborted."
            exit 1
          fi

          git config --global user.email "azure-pipelines@threadops.internal"
          git config --global user.name "Azure Pipelines Bot"

          export TARGET_TAG="$(Build.SourceVersion)"
          echo "Promoting gitops-manifests with immutable SHA: $TARGET_TAG"

          git clone "https://x-access-token:${TOKEN}@github.com/KoushikPraneeth/gitops-manifests.git" manifests
          cd manifests

          # Selective Python update for application image tags only (leaves postgres & redis intact)
          python3 -c "
          import os
          tag = os.environ.get('TARGET_TAG')
          with open('chart/values.yaml', 'r') as f:
              lines = f.readlines()
          new_lines = []
          in_app_service = False
          for line in lines:
              if line.startswith('coreApi:') or line.startswith('webClient:') or line.startswith('notifyService:'):
                  in_app_service = True
              elif line and not line[0].isspace() and not line.startswith('#'):
                  in_app_service = False

              if in_app_service and 'tag:' in line:
                  indent = line[:line.find('tag:')]
                  new_lines.append(f'{indent}tag: \"{tag}\"\n')
              else:
                  new_lines.append(line)
          with open('chart/values.yaml', 'w') as f:
              f.writelines(new_lines)
          "

          git diff chart/values.yaml
          git add chart/values.yaml
          git commit -m "chore(gitops): auto-promote application images to $TARGET_TAG [skip ci]" || echo "No changes to commit"
          git push origin main
        displayName: 'GitOps: Auto-promote Image SHA in Helm Values'
        env:
          TOKEN: $(GITHUB_PAT)
