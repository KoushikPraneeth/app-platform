trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - 'README.md'
      - '.gitignore'

pool:
  vmImage: 'ubuntu-latest'

variables:
  acrServiceConnection: 'acr-service-connection'
  acrRegistry: 'acrdevpk.azurecr.io'

stages:
  # =========================================================================
  # STAGE 1: Sequential Quality & Security Gate (Single Free-Tier Agent Job)
  # =========================================================================
  - stage: QualityAndSecurity
    displayName: 'Quality & Security Verification'
    jobs:
      - job: ValidateAndScan
        displayName: 'Run Tests, Lint & Trivy Scan'
        steps:
          # --- 1. Python Environment Setup ---
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
            displayName: 'Set up Python 3.11'

          # --- 2. Unit Tests: core-api ---
          - script: |
              python -m pip install --upgrade pip
              pip install -r services/core-api/requirements.txt pytest pytest-cov
              cd services/core-api && pytest tests/
            displayName: 'Pytest: core-api'

          # --- 3. Unit Tests: notify-service ---
          - script: |
              pip install -r services/notify-service/requirements.txt pytest pytest-cov httpx
              cd services/notify-service && pytest tests/
            displayName: 'Pytest: notify-service'

          # --- 4. Node.js Environment Setup ---
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Set up Node.js 20.x'

          # --- 5. Lint: web-client ---
          - script: |
              cd services/web-client
              npm install
              npm run lint
            displayName: 'ESLint: web-client'

          # --- 6. Security: Trivy Vulnerability Scan ---
          - script: |
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
              trivy fs --severity HIGH,CRITICAL --exit-code 0 services/core-api
              trivy fs --severity HIGH,CRITICAL --exit-code 0 services/web-client
            displayName: 'Trivy: Filesystem Scan (High & Critical)'

  # =========================================================================
  # STAGE 2: Multi-Stage Docker Builds & Push to ACR
  # =========================================================================
  - stage: BuildAndPush
    displayName: 'Build & Push Images to ACR'
    dependsOn: QualityAndSecurity
    condition: succeeded()
    jobs:
      - job: BuildPushContainers
        displayName: 'Docker Build & Push (Immutable SHA Tags)'
        steps:
          - task: Docker@2
            displayName: 'Build & Push: core-api'
            inputs:
              containerRegistry: $(acrServiceConnection)
              repository: 'core-api'
              command: 'buildAndPush'
              Dockerfile: 'services/core-api/Dockerfile'
              buildContext: 'services/core-api'
              tags: |
                $(Build.SourceVersion)
                latest

          - task: Docker@2
            displayName: 'Build & Push: web-client'
            inputs:
              containerRegistry: $(acrServiceConnection)
              repository: 'web-client'
              command: 'buildAndPush'
              Dockerfile: 'services/web-client/Dockerfile'
              buildContext: 'services/web-client'
              tags: |
                $(Build.SourceVersion)
                latest

          - task: Docker@2
            displayName: 'Build & Push: notify-service'
            inputs:
              containerRegistry: $(acrServiceConnection)
              repository: 'notify-service'
              command: 'buildAndPush'
              Dockerfile: 'services/notify-service/Dockerfile'
              buildContext: 'services/notify-service'
              tags: |
                $(Build.SourceVersion)
                latest

  # =========================================================================
  # STAGE 3: GitOps Automated Handoff (Updates gitops-manifests)
  # =========================================================================
  - stage: GitOpsSync
    displayName: 'GitOps Manifest Tag Promotion'
    dependsOn: BuildAndPush
    condition: succeeded()
    jobs:
      - job: UpdateManifests
        displayName: 'Promote New Image SHA to Helm Values'
        steps:
          - script: |
              git config --global user.email "azure-pipelines@threadops.internal"
              git config --global user.name "Azure Pipelines Bot"

              TARGET_TAG="$(Build.SourceVersion)"
              echo "Promoting gitops-manifests with immutable SHA: $TARGET_TAG"

              git clone https://$(GITHUB_PAT)@github.com/KoushikPraneeth/gitops-manifests.git manifests
              cd manifests

              # Replace image tags in values.yaml
              sed -i "s|tag: \".*\"|tag: \"$TARGET_TAG\"|g" chart/values.yaml

              git diff chart/values.yaml
              git add chart/values.yaml
              git commit -m "chore(gitops): auto-promote core-api & web-client to $TARGET_TAG [skip ci]" || echo "No changes to commit"
              git push origin main
            displayName: 'Update values.yaml & Push to GitOps Repo'
            env:
              GITHUB_PAT: $(GITHUB_PAT)
